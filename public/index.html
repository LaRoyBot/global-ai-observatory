<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global AI Observatory</title>
<meta name="description" content="A modular geographic intelligence platform for the global AI economy: infrastructure, providers, models, token relationships, economics, adoption and research. Hybrid verified and clearly-labelled synthetic data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tokens.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.2"/>
        <ellipse cx="12" cy="12" rx="9" ry="3.6" stroke="currentColor" stroke-width="0.9" opacity="0.7"/>
        <path d="M12 3v18M3.6 8.5h16.8M3.6 15.5h16.8" stroke="currentColor" stroke-width="0.7" opacity="0.5"/>
      </svg>
      <span class="brand-text">
        <span class="brand-eyebrow">Global AI Observatory</span>
        <span class="brand-title" id="topbar-title">Overview</span>
      </span>
    </div>
    <div class="topbar-spacer"></div>
    <span class="topbar-meta" id="topbar-meta">EXPERIMENTAL / HYBRID DATA / GLOBAL</span>
    <div class="disclaimer" id="global-disclaimer" title="Token-flow relationships are a synthetic demonstration, not measured international traffic.">
      <span class="dot"></span><span>Synthetic demo data, not measured international token traffic</span>
    </div>
    <button class="btn ghost sm" id="btn-search" aria-label="Search the observatory (Ctrl+K)">Search <kbd>Ctrl K</kbd></button>
    <button class="btn ghost icon" id="btn-settings" aria-label="Settings" title="Settings">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
    </button>
  </header>

  <nav id="rail" aria-label="Workspaces"></nav>

  <main id="main" tabindex="-1">
    <div class="loading-block"><span class="spinner"></span>INITIALISING OBSERVATORY…</div>
  </main>
</div>

<dialog class="search-dialog" id="search-dialog" aria-label="Global search">
  <div class="search-head">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.3"/><path d="m10.6 10.6 3 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    <input id="search-input" type="search" placeholder="Search countries, providers, models, infrastructure, research…" autocomplete="off" aria-label="Search query">
    <button class="btn ghost sm" id="search-close">Esc</button>
  </div>
  <div class="search-results" id="search-results"></div>
  <div class="search-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</dialog>

<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">The Global AI Observatory requires JavaScript. Token-flow demonstration data is synthetic and fictional.</p></noscript>
<script type="module" src="/src/app/shell.js"></script>
</body>
</html>
